[platformio]
src_dir     = esp3d
build_dir   = .pioenvs
lib_dir     = libraries
libdeps_dir = .piolibdeps
data_dir = esp3d/data
default_envs = esp8266_4MB_wifi

[env:esp8266_4MB_wifi]
platform = espressif8266@4.1.0
board = esp12e
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter, direct, esp8266_exception_decoder
; set frequency to 160MHz
board_build.f_cpu = 160000000L
; set frequency to 40MHz
board_build.f_flash = 40000000L
board_build.flash_mode = qio
upload_resetmethod = ck
upload_speed = 115200
extra_scripts = pre:platformIO/extra_script.py
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
lib_ignore = 
	ESP32SSDP
	esp32-usb-serial
build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DNONOSDK221=1
    -DNDEBUG -DVTABLES_IN_FLASH
    -DWAVEFORM_LOCKED_PWM

[env:esp32c3_4MB_wifi]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.04/platform-espressif32.zip
board =  esp32-c3-devkitm-1
framework = arduino
board_build.mcu = esp32c3
board_build.variant = esp32c3
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter, direct, esp32_exception_decoder
; set frequency to 240MHz
board_build.f_cpu = 240000000L
; set frequency to 80MHz
board_build.f_flash = 80000000L
board_build.flash_mode = qio
upload_speed = 460800
upload_port = /dev/ttyACM0
extra_scripts = pre:platformIO/extra_script.py
board_build.filesystem = littlefs
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
lib_ignore = esp32-usb-serial
build_flags =  -DCORE_DEBUG_LEVEL=0
    -DCONFIG_IDF_TARGET_ESP32C3=1
    ; Maximum standard ESP32-C3 Wi-Fi transmit power (19.5 dBm).